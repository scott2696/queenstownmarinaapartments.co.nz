<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="s" x="-15%" y="-10%" width="135%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="sm" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Phone -->
  <g filter="url(#s)">
    <rect x="95" y="30" width="130" height="250" rx="18" fill="url(#phoneBody)"/>
    <rect x="101" y="44" width="118" height="222" rx="4" fill="url(#screen)"/>
    <!-- Notch -->
    <rect x="140" y="33" width="40" height="6" rx="3" fill="#0f172a"/>
  </g>

  <!-- Screen content: payout confirmation -->
  <!-- Top bar -->
  <rect x="105" y="48" width="110" height="24" rx="2" fill="rgba(255,255,255,0.05)"/>
  <circle cx="117" cy="60" r="4" fill="#10b981"/>
  <rect x="124" y="57" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>

  <!-- Big checkmark circle -->
  <circle cx="160" cy="110" r="28" fill="rgba(16,185,129,0.15)"/>
  <circle cx="160" cy="110" r="22" fill="url(#greenGrad)"/>
  <path d="M149 110 L156 118 L172 102" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "Withdrawal Complete" text block -->
  <rect x="122" y="145" width="76" height="7" rx="3.5" fill="rgba(255,255,255,0.6)"/>
  <rect x="132" y="157" width="56" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Amount -->
  <text x="160" y="185" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="800" font-size="22" fill="#fcd34d">NZ$2,500</text>

  <!-- Timer line -->
  <rect x="118" y="200" width="84" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="118" y="200" width="84" height="4" rx="2" fill="url(#greenGrad)"/>

  <!-- "Under 30 min" text -->
  <text x="160" y="218" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="600" font-size="9" fill="rgba(255,255,255,0.5)">&#9889; Under 30 min</text>

  <!-- Bottom nav dots -->
  <circle cx="148" cy="240" r="3" fill="rgba(255,255,255,0.15)"/>
  <circle cx="160" cy="240" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="172" cy="240" r="3" fill="rgba(255,255,255,0.15)"/>

  <!-- Gold coins flying out of phone -->
  <!-- Large coin top right -->
  <g filter="url(#sm)" transform="translate(240,70)">
    <ellipse cx="0" cy="0" rx="26" ry="26" fill="url(#goldShine)"/>
    <ellipse cx="0" cy="0" rx="20" ry="20" stroke="#d97706" stroke-width="1.5" fill="none"/>
    <text x="0" y="2" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="700" font-size="18" fill="#92400e">$</text>
  </g>

  <!-- Medium coin right -->
  <g filter="url(#sm)" transform="translate(250,145)">
    <circle cx="0" cy="0" r="19" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="14.5" stroke="#d97706" stroke-width="1.2" fill="none"/>
    <text x="0" y="1.5" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#92400e">$</text>
  </g>

  <!-- Small coin top -->
  <g filter="url(#sm)" transform="translate(205,25)">
    <circle cx="0" cy="0" r="14" fill="url(#gold)" opacity="0.85"/>
    <circle cx="0" cy="0" r="10" stroke="#d97706" stroke-width="1" fill="none"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="700" font-size="9" fill="#92400e">$</text>
  </g>

  <!-- Coin left side -->
  <g filter="url(#sm)" transform="translate(60,120)">
    <circle cx="0" cy="0" r="20" fill="url(#goldShine)"/>
    <circle cx="0" cy="0" r="15.5" stroke="#d97706" stroke-width="1.2" fill="none"/>
    <text x="0" y="1.5" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="700" font-size="14" fill="#92400e">$</text>
  </g>

  <!-- Small coin bottom left -->
  <g filter="url(#sm)" transform="translate(55,200)">
    <circle cx="0" cy="0" r="12" fill="url(#gold)" opacity="0.7"/>
    <circle cx="0" cy="0" r="8.5" stroke="#d97706" stroke-width="1" fill="none"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="700" font-size="8" fill="#92400e">$</text>
  </g>

  <!-- Clock badge bottom right -->
  <g filter="url(#sm)" transform="translate(255,210)">
    <circle cx="0" cy="0" r="24" fill="#1e2a4a" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Clock face markings -->
    <line x1="0" y1="-16" x2="0" y2="-12" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="0" y2="12" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="-12" y2="0" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="0" x2="12" y2="0" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#fcd34d"/>
  </g>

  <!-- Motion lines from coins -->
  <line x1="228" y1="80" x2="218" y2="85" stroke="rgba(252,211,77,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="230" y1="68" x2="220" y2="68" stroke="rgba(252,211,77,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="240" y1="155" x2="232" y2="152" stroke="rgba(252,211,77,0.2)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sparkles -->
  <path d="M280 100 L282 106 L288 108 L282 110 L280 116 L278 110 L272 108 L278 106Z" fill="rgba(252,211,77,0.5)"/>
  <path d="M40 80 L41.5 84 L45.5 85.5 L41.5 87 L40 91 L38.5 87 L34.5 85.5 L38.5 84Z" fill="rgba(252,211,77,0.35)"/>
  <circle cx="290" cy="180" r="2" fill="rgba(252,211,77,0.3)"/>
  <circle cx="35" cy="160" r="1.5" fill="rgba(252,211,77,0.25)"/>
  <circle cx="75" cy="55" r="2" fill="rgba(255,255,255,0.2)"/>
</svg>